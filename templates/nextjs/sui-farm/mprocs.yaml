scrollback: 10000
procs:
  client:
    cwd: packages/client
    shell: pnpm dubhe wait --local-indexer && pnpm dev
  contracts:
    cwd: packages/contracts
    shell: pnpm dubhe wait --localnet && pnpm setup:localnet
  node:
    cwd: packages/contracts
    shell: pnpm dubhe node --force
  graphql-server:
    cwd: ../../../..
    shell: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres pnpm --filter @0xobelisk/graphql-server start:cli
  shell:
    cwd: packages/contracts
    shell: pnpm dubhe wait --local-indexer && pnpm dubhe shell
